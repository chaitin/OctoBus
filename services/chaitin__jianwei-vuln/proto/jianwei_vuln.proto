syntax = "proto3";

package jianwei.vuln.service;

// ============================================================
// Shared / Common Messages
// ============================================================

message Pagination {
  int64 count = 1 [json_name = "count"];
  int64 offset = 2 [json_name = "offset"];
}

message OrderBy {
  bool ascending = 1 [json_name = "ascending"];
  string field = 2 [json_name = "field"];
}

message FilterOper {
  string oper = 1 [json_name = "oper"];
}

message IntFilter {
  string oper = 1 [json_name = "oper"];
  int64 target = 2 [json_name = "target"];
}

message StringFilter {
  string oper = 1 [json_name = "oper"];
  string target = 2 [json_name = "target"];
}

message BoolFilter {
  string oper = 1 [json_name = "oper"];
  bool target = 2 [json_name = "target"];
}

message UserInfo {
  int64 id = 1 [json_name = "id"];
  string name = 2 [json_name = "name"];
  string username = 3 [json_name = "username"];
  string email = 4 [json_name = "email"];
  string phone = 5 [json_name = "phone"];
  repeated OrganizationInfo user_organizations = 6 [json_name = "user_organizations"];
}

message OrganizationInfo {
  int64 id = 1 [json_name = "id"];
  string name = 2 [json_name = "name"];
  int64 superior_organization_id = 3 [json_name = "superior_organization_id"];
}

message ScopeInfo {
  int64 id = 1 [json_name = "id"];
  string name = 2 [json_name = "name"];
  string full_name = 3 [json_name = "full_name"];
  bool no_link = 4 [json_name = "no_link"];
}

message BusinessInfo {
  int64 id = 1 [json_name = "id"];
  string name = 2 [json_name = "name"];
  string full_name = 3 [json_name = "full_name"];
  bool no_link = 4 [json_name = "no_link"];
}

message AssetTagInfo {
  int64 id = 1 [json_name = "id"];
  string tag_name = 2 [json_name = "tag_name"];
  string color = 3 [json_name = "color"];
}

message FindBySource {
  int64 asset_id = 1 [json_name = "asset_id"];
  int64 source_id = 2 [json_name = "source_id"];
  string source_name = 3 [json_name = "source_name"];
  string source_type = 4 [json_name = "source_type"];
}

message DisposeUserInfo {
  int64 id = 1 [json_name = "id"];
  string name = 2 [json_name = "name"];
  string username = 3 [json_name = "username"];
  bool no_link = 4 [json_name = "no_link"];
}

message AffectedProduct {
  string name = 1 [json_name = "name"];
  string alias = 2 [json_name = "alias"];
  string category = 3 [json_name = "category"];
  string category_cn = 4 [json_name = "category_cn"];
  string cpe = 5 [json_name = "cpe"];
  string description = 6 [json_name = "description"];
}

message Empty {}

// ============================================================
// AssetService
// ============================================================

service AssetService {
  rpc ListAssets(ListAssetsRequest) returns (ListAssetsResponse);
  rpc GetAsset(GetAssetRequest) returns (GetAssetResponse);
  rpc UpdateAsset(UpdateAssetRequest) returns (UpdateAssetResponse);
  rpc BatchUpdateAssets(BatchUpdateAssetsRequest) returns (BatchUpdateAssetsResponse);
}

// --- Asset messages ---

message AssetFilter {
  repeated IntFilter id = 1 [json_name = "id"];
  repeated IntFilter asset_state = 2 [json_name = "asset_state"];
  repeated IntFilter asset_risk_level = 3 [json_name = "asset_risk_level"];
  repeated StringFilter asset_risk = 4 [json_name = "asset_risk"];
  repeated BoolFilter auto_update = 5 [json_name = "auto_update"];
  repeated IntFilter business_id = 6 [json_name = "business_id"];
  repeated IntFilter business_owner_id = 7 [json_name = "business_owner_id"];
  repeated StringFilter created_at = 8 [json_name = "created_at"];
  repeated IntFilter created_by = 9 [json_name = "created_by"];
  repeated StringFilter description = 10 [json_name = "description"];
  repeated BoolFilter external = 11 [json_name = "external"];
  repeated StringFilter find_at = 12 [json_name = "find_at"];
  repeated IntFilter grade_lv = 13 [json_name = "grade_lv"];
  repeated IntFilter importance = 14 [json_name = "importance"];
  repeated StringFilter last_survival_at = 15 [json_name = "last_survival_at"];
  repeated IntFilter owner_id = 16 [json_name = "owner_id"];
  repeated IntFilter organization_id = 17 [json_name = "organization_id"];
  repeated IntFilter scope_id = 18 [json_name = "scope_id"];
  repeated StringFilter ip = 19 [json_name = "ip"];
  repeated StringFilter name = 20 [json_name = "name"];
  repeated IntFilter online_status = 21 [json_name = "online_status"];
  repeated StringFilter port = 22 [json_name = "port"];
  repeated BoolFilter internet_exposure = 23 [json_name = "internet_exposure"];
}

message AssetUpdateData {
  int64 asset_state = 1 [json_name = "asset_state"];
  bool auto_update = 2 [json_name = "auto_update"];
  repeated int64 business_id = 3 [json_name = "business_id"];
  string description = 4 [json_name = "description"];
  repeated int64 extra_owner_ids = 5 [json_name = "extra_owner_ids"];
  int64 organization_id = 6 [json_name = "organization_id"];
  int64 owner_id = 7 [json_name = "owner_id"];
  int64 scope_id = 8 [json_name = "scope_id"];
  repeated string tags = 9 [json_name = "tags"];
}

message AssetDetail {
  int64 id = 1 [json_name = "id"];
  string ip = 2 [json_name = "ip"];
  string name = 3 [json_name = "name"];
  int64 asset_state = 4 [json_name = "asset_state"];
  string asset_risk = 5 [json_name = "asset_risk"];
  int64 asset_risk_level = 6 [json_name = "asset_risk_level"];
  bool auto_update = 7 [json_name = "auto_update"];
  repeated BusinessInfo business = 8 [json_name = "business"];
  repeated int64 business_id = 9 [json_name = "business_id"];
  UserInfo business_owner = 10 [json_name = "business_owner"];
  int64 business_owner_id = 11 [json_name = "business_owner_id"];
  string created_at = 12 [json_name = "created_at"];
  int64 created_by = 13 [json_name = "created_by"];
  string description = 14 [json_name = "description"];
  bool draft = 15 [json_name = "draft"];
  bool external = 16 [json_name = "external"];
  repeated UserInfo extra_owners = 17 [json_name = "extra_owners"];
  repeated int64 extra_owner_ids = 18 [json_name = "extra_owner_ids"];
  string find_at = 19 [json_name = "find_at"];
  repeated FindBySource find_by_source = 20 [json_name = "find_by_source"];
  int64 grade_lv = 21 [json_name = "grade_lv"];
  int64 importance = 22 [json_name = "importance"];
  bool internet_exposure = 23 [json_name = "internet_exposure"];
  string last_survival_at = 24 [json_name = "last_survival_at"];
  string method = 25 [json_name = "method"];
  int64 online_status = 26 [json_name = "online_status"];
  UserInfo owner = 27 [json_name = "owner"];
  int64 owner_id = 28 [json_name = "owner_id"];
  OrganizationInfo organization = 29 [json_name = "organization"];
  int64 organization_id = 30 [json_name = "organization_id"];
  ScopeInfo scope = 31 [json_name = "scope"];
  int64 scope_id = 32 [json_name = "scope_id"];
  repeated AssetTagInfo asset_tags = 33 [json_name = "asset_tags"];
  string port = 34 [json_name = "port"];
}

message ListAssetsRequest {
  int64 count = 1 [json_name = "count"];
  int64 offset = 2 [json_name = "offset"];
  repeated OrderBy order_by = 3 [json_name = "orderBy"];
  AssetFilter filter = 4 [json_name = "filter"];
}

message ListAssetsResponse {
  int64 total = 1 [json_name = "total"];
  repeated AssetDetail data = 2 [json_name = "data"];
}

message GetAssetRequest {
  int64 id = 1 [json_name = "id"];
  int64 workflow_id = 2 [json_name = "workflow_id"];
}

message GetAssetResponse {
  AssetDetail data = 1 [json_name = "data"];
}

message UpdateAssetRequest {
  int64 id = 1 [json_name = "id"];
  AssetUpdateData data = 2 [json_name = "data"];
  bool update_empty_col = 3 [json_name = "update_empty_col"];
}

message UpdateAssetResponse {
  AssetDetail data = 1 [json_name = "data"];
}

message BatchUpdateAssetsRequest {
  repeated int64 asset_ids = 1 [json_name = "asset_ids"];
  AssetUpdateData data = 2 [json_name = "data"];
  bool cascade_vuln = 3 [json_name = "cascade_vuln"];
  int64 conflict_strategy = 4 [json_name = "conflict_strategy"];
  bool update_empty_col = 5 [json_name = "update_empty_col"];
}

message BatchUpdateAssetsResponse {
  repeated int64 duplicated = 1 [json_name = "duplicated"];
}

// ============================================================
// VulnerabilityService
// ============================================================

service VulnerabilityService {
  rpc ListIpVulnerabilities(ListIpVulnsRequest) returns (ListIpVulnsResponse);
  rpc ListWebVulnerabilities(ListWebVulnsRequest) returns (ListWebVulnsResponse);
  rpc GetVulnerabilityDetails(GetVulnDetailsRequest) returns (GetVulnDetailsResponse);
  rpc UpdateVulnerabilityStatus(UpdateVulnStatusRequest) returns (UpdateVulnStatusResponse);
}

// --- Vulnerability messages ---

message VulnIpFilter {
  repeated IntFilter id = 1 [json_name = "id"];
  repeated IntFilter check_type = 2 [json_name = "check_type"];
  repeated StringFilter ct_id = 3 [json_name = "ct_id"];
  repeated StringFilter cve = 4 [json_name = "cve"];
  repeated IntFilter manager_id = 5 [json_name = "manager_id"];
  repeated StringFilter dispose_fix_time = 6 [json_name = "dispose_fix_time"];
  repeated StringFilter fix_remarks = 7 [json_name = "fix_remarks"];
  repeated StringFilter find_by = 8 [json_name = "find_by"];
  repeated IntFilter merge_num = 9 [json_name = "merge_num"];
  repeated IntFilter severity = 10 [json_name = "severity"];
  repeated IntFilter vuln_status = 11 [json_name = "vuln_status"];
  repeated StringFilter customize_tag_name = 12 [json_name = "customize_tag_name"];
  repeated StringFilter ip = 13 [json_name = "ip"];
  repeated IntFilter asset_state = 14 [json_name = "asset_state"];
  repeated StringFilter asset_risk = 15 [json_name = "asset_risk"];
  repeated IntFilter asset_id = 16 [json_name = "asset_id"];
  repeated BoolFilter is_poc_null = 17 [json_name = "is_poc_null"];
  repeated BoolFilter is_reoccurrence = 18 [json_name = "is_reoccurrence"];
}

message VulnWebFilter {
  repeated IntFilter id = 1 [json_name = "id"];
  repeated IntFilter check_type = 2 [json_name = "check_type"];
  repeated StringFilter ct_id = 3 [json_name = "ct_id"];
  repeated StringFilter cve = 4 [json_name = "cve"];
  repeated IntFilter manager_id = 5 [json_name = "manager_id"];
  repeated StringFilter dispose_fix_time = 6 [json_name = "dispose_fix_time"];
  repeated StringFilter fix_remarks = 7 [json_name = "fix_remarks"];
  repeated StringFilter find_by = 8 [json_name = "find_by"];
  repeated IntFilter merge_num = 9 [json_name = "merge_num"];
  repeated IntFilter severity = 10 [json_name = "severity"];
  repeated IntFilter vuln_status = 11 [json_name = "vuln_status"];
  repeated StringFilter customize_tag_name = 12 [json_name = "customize_tag_name"];
  repeated BoolFilter is_match_vuln = 13 [json_name = "is_match_vuln"];
  repeated BoolFilter is_poc_null = 14 [json_name = "is_poc_null"];
  repeated BoolFilter is_reoccurrence = 15 [json_name = "is_reoccurrence"];
}

message VulnDetailData {
  int64 id = 1 [json_name = "id"];
  string cve = 2 [json_name = "cve"];
  string cve_id = 3 [json_name = "cve_id"];
  string ct_id = 4 [json_name = "ct_id"];
  string cncve = 5 [json_name = "cncve"];
  string cnnvd = 6 [json_name = "cnnvd"];
  string cnvd = 7 [json_name = "cnvd"];
  string cwe = 8 [json_name = "cwe"];
  string bugtraq_id = 9 [json_name = "bugtraq_id"];
  string cpe = 10 [json_name = "cpe"];
  float cvss = 11 [json_name = "cvss"];
  string cvss_vector = 12 [json_name = "cvss_vector"];
  string cvss3 = 13 [json_name = "cvss3"];
  float cvss3_score = 14 [json_name = "cvss3_score"];
  int64 check_type = 15 [json_name = "check_type"];
  float definiteness = 16 [json_name = "definiteness"];
  string affected_scope = 17 [json_name = "affected_scope"];
  string affected_scope_cn = 18 [json_name = "affected_scope_cn"];
  string attack_vector = 19 [json_name = "attack_vector"];
  string attack_complexity = 20 [json_name = "attack_complexity"];
  string confidentiality_impact = 21 [json_name = "confidentiality_impact"];
  string availability_Impact = 22 [json_name = "availability_Impact"];
  int64 exploit_complexity = 23 [json_name = "exploit_complexity"];
  string exploit_complexity_cn = 24 [json_name = "exploit_complexity_cn"];
  int64 exploit_difficulty = 25 [json_name = "exploit_difficulty"];
  string exploit_difficulty_cn = 26 [json_name = "exploit_difficulty_cn"];
  int64 degree_of_secrecy = 27 [json_name = "degree_of_secrecy"];
  string degree_of_secrecy_cn = 28 [json_name = "degree_of_secrecy_cn"];
  string exp = 29 [json_name = "exp"];
  string disclosure_date = 30 [json_name = "disclosure_date"];
  string created_at = 31 [json_name = "created_at"];
  repeated string customize_tag_names = 32 [json_name = "customize_tag_names"];
  repeated AffectedProduct affected_products = 33 [json_name = "affected_products"];
  repeated DisposeUserInfo dispose_by = 34 [json_name = "dispose_by"];
  int64 severity = 35 [json_name = "severity"];
  int64 vuln_status = 36 [json_name = "vuln_status"];
  string fix_remarks = 37 [json_name = "fix_remarks"];
  int64 manager_id = 38 [json_name = "manager_id"];
  string manager_name = 39 [json_name = "manager_name"];
}

message ListIpVulnsRequest {
  int64 count = 1 [json_name = "count"];
  int64 offset = 2 [json_name = "offset"];
  repeated OrderBy order_by = 3 [json_name = "orderBy"];
  VulnIpFilter filter = 4 [json_name = "filter"];
}

message ListIpVulnsResponse {
  int64 total = 1 [json_name = "total"];
  repeated VulnDetailData data = 2 [json_name = "data"];
}

message ListWebVulnsRequest {
  int64 count = 1 [json_name = "count"];
  int64 offset = 2 [json_name = "offset"];
  repeated OrderBy order_by = 3 [json_name = "orderBy"];
  VulnWebFilter filter = 4 [json_name = "filter"];
}

message ListWebVulnsResponse {
  int64 total = 1 [json_name = "total"];
  repeated VulnDetailData data = 2 [json_name = "data"];
}

message GetVulnDetailsRequest {
  int64 vuln_id = 1 [json_name = "vuln_id"];
  string workflow_id = 2 [json_name = "workflow_id"];
}

message GetVulnDetailsResponse {
  VulnDetailData data = 1 [json_name = "data"];
}

message UpdateVulnStatusRequest {
  repeated int64 vuln_ids = 1 [json_name = "vuln_ids"];
  int64 vuln_status = 2 [json_name = "vuln_status"];
  string vuln_type = 3 [json_name = "vuln_type"];
  repeated string fix_remarks = 4 [json_name = "fix_remarks"];
  string remark = 5 [json_name = "remark"];
  string workflow_id = 6 [json_name = "workflow_id"];
  bool skip_end_status = 7 [json_name = "skip_end_status"];
  int64 exposure_exec_id = 8 [json_name = "exposure_exec_id"];
  repeated int64 exposure_result_id = 9 [json_name = "exposure_result_id"];
}

message UpdateVulnStatusResponse {}

// ============================================================
// DisposalService
// ============================================================

service DisposalService {
  rpc DirectVulnDispose(DirectVulnDisposeRequest) returns (DirectVulnDisposeResponse);
  rpc VulnDisposeHistory(VulnDisposeHistoryRequest) returns (VulnDisposeHistoryResponse);
  rpc SaveVulnWorkflowStatus(SaveVulnWorkflowStatusRequest) returns (SaveVulnWorkflowStatusResponse);
}

message DirectVulnDisposeRequest {
  repeated int64 vuln_ids = 1 [json_name = "vuln_ids"];
  int64 vuln_status = 2 [json_name = "vuln_status"];
  string vuln_type = 3 [json_name = "vuln_type"];
  repeated string fix_remarks = 4 [json_name = "fix_remarks"];
  string remark = 5 [json_name = "remark"];
  string workflow_id = 6 [json_name = "workflow_id"];
  bool skip_end_status = 7 [json_name = "skip_end_status"];
  int64 exposure_exec_id = 8 [json_name = "exposure_exec_id"];
  repeated int64 exposure_result_id = 9 [json_name = "exposure_result_id"];
}

message DirectVulnDisposeResponse {}

message VulnDisposeHistoryRequest {
  int64 vuln_id = 1 [json_name = "vuln_id"];
  string vuln_type = 2 [json_name = "vuln_type"];
}

message DisposeDetail {
  string dispose_audit_ip = 1 [json_name = "dispose_audit_ip"];
  string dispose_order = 2 [json_name = "dispose_order"];
  string email_content = 3 [json_name = "email_content"];
  string email_title = 4 [json_name = "email_title"];
  repeated string emails = 5 [json_name = "emails"];
  int64 exposure_exec_id = 6 [json_name = "exposure_exec_id"];
  repeated int64 exposure_result_id = 7 [json_name = "exposure_result_id"];
  repeated string fix_remarks = 8 [json_name = "fix_remarks"];
  repeated int64 receive_user = 9 [json_name = "receive_user"];
  string remark = 10 [json_name = "remark"];
  int64 vuln_status = 11 [json_name = "vuln_status"];
}

message VulnDisposeRecord {
  string created_at = 1 [json_name = "created_at"];
  DisposeDetail dispose_detail = 2 [json_name = "dispose_detail"];
  int64 vuln_id = 3 [json_name = "vuln_id"];
  UserInfo dispose_user = 4 [json_name = "dispose_user"];
}

message VulnDisposeHistoryResponse {
  repeated VulnDisposeRecord vuln_dispose_record = 1 [json_name = "vuln_dispose_record"];
}

message SaveVulnWorkflowStatusRequest {
  string vuln_type = 1 [json_name = "vuln_type"];
  map<string, VulnIdList> status_map = 2 [json_name = "status_map"];
}

message VulnIdList {
  repeated int64 ids = 1 [json_name = "ids"];
}

message SaveVulnWorkflowStatusResponse {}

