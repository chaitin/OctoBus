  repeated StringFilter cve_id = 3 [json_name = "cve_id"];
  repeated StringFilter cnnvd_id = 4 [json_name = "cnnvd_id"];
  repeated StringFilter cnvd_id = 5 [json_name = "cnvd_id"];
  repeated StringFilter cwe = 6 [json_name = "cwe"];
  repeated StringFilter severity = 7 [json_name = "severity"];
  repeated StringFilter title = 8 [json_name = "title"];
  repeated StringFilter affected_scope = 9 [json_name = "affected_scope"];
