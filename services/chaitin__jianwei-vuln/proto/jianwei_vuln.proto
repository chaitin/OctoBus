  rpc GetStandardVulnDetailByID(GetStandardVulnDetailByIDRequest) returns (GetStandardVulnDetailByIDResponse);
  rpc SearchCustomizeTags(SearchCustomizeTagsRequest) returns (SearchCustomizeTagsResponse);
  rpc CreateCustomizeTag(CreateCustomizeTagRequest) returns (CreateCustomizeTagResponse);
  rpc DeleteCustomizeTag(DeleteCustomizeTagRequest) returns (DeleteCustomizeTagResponse);
  rpc AppendCustomizeTags(AppendCustomizeTagsRequest) returns (AppendCustomizeTagsResponse);
  rpc ReplaceCustomizeTags(ReplaceCustomizeTagsRequest) returns (ReplaceCustomizeTagsResponse);
}

