syntax = "proto3";

package CTYun_SecurityGuard;

import "google/protobuf/struct.proto";

option go_package = "miner/grpc-service/CTYun_SecurityGuard";

service CTYun_SecurityGuard {
  rpc AssetClassify(CTYunRequest) returns (CTYunResponse) {}
}

message CTYunRequest {
  google.protobuf.Struct payload = 1;
}


message CTYunResponse {
  google.protobuf.Value response = 1;
}
