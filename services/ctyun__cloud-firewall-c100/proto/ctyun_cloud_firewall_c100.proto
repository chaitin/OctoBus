syntax = "proto3";

package CTYun_CloudFirewallC100;

import "google/protobuf/struct.proto";

option go_package = "miner/grpc-service/CTYun_CloudFirewallC100";

service CTYun_CloudFirewallC100 {
  rpc QueryFirewallSimpleInfo(CTYunRequest) returns (CTYunResponse) {}
}

message CTYunRequest {
  google.protobuf.Struct payload = 1;
}


message CTYunResponse {
  google.protobuf.Value response = 1;
}
