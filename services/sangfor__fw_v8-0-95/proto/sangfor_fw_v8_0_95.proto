syntax = "proto3";

package Sangfor_FW_V8095;

import "google/protobuf/struct.proto";

option go_package = "miner/grpc-service/Sangfor_FW_V8095";

service Sangfor_FW_V8095 {
  rpc Login(LoginRequest) returns (ApiResponse) {}
  rpc KeepAlive(TokenRequest) returns (ApiResponse) {}
  rpc Logout(TokenRequest) returns (ApiResponse) {}

  rpc ListBlackWhiteList(ListBlackWhiteListRequest) returns (ApiResponse) {}
  rpc AddBlacklist(BlackListRequest) returns (ApiResponse) {}
  rpc RemoveBlacklist(BlackListRequest) returns (ApiResponse) {}

  rpc ListBlockedIP(ListBlockedIPRequest) returns (ApiResponse) {}
  rpc BlockIP(BlockIPRequest) returns (ApiResponse) {}
  rpc UnblockIP(UnblockIPRequest) returns (ApiResponse) {}

  rpc GetBlockTime(TokenRequest) returns (ApiResponse) {}
  rpc SetBlockTime(SetBlockTimeRequest) returns (ApiResponse) {}
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message TokenRequest {
  string token = 1;
}

message ListBlackWhiteListRequest {
  string token = 1;
  string type = 2; // BLACK or WHITE. Defaults to BLACK.
  string search = 3;
  string url = 4;
  int32 start = 5;
  int32 length = 6;
}

message BlackListRequest {
  string token = 1;
  repeated string targets = 2; // IP, subnet, range, domain, or URL.
  string description = 3;
  bool enable = 4;
  string override_mode = 5; // PROMPT, REPLACE, SKIP, SKIPBACK, or PROMPTALL.
}

message ListBlockedIPRequest {
  string token = 1;
  string search = 2;
  int32 start = 3;
  int32 length = 4;
}

message BlockIPRequest {
  string token = 1;
  repeated string src_ips = 2;
  repeated string dst_ips = 3;
  repeated string dns = 4;
  repeated string urls = 5;
  int32 dst_port = 6;
  string block_time = 7; // For example 30m, 1h, or 3d.
  string attack = 8; // Defaults to PLT-MANUAL.
  string creator = 9; // Defaults to AF.
}

message UnblockIPItem {
  string src_ip = 1;
  string dst_ip = 2;
  string dns = 3;
  string url = 4;
  int32 dst_port = 5;
  string attack = 6; // Defaults to PLT-MANUAL.
  string scope = 7; // GLOBAL or BUSINESS.
}

message UnblockIPRequest {
  string token = 1;
  repeated UnblockIPItem items = 2;
}

message SetBlockTimeRequest {
  string token = 1;
  string block_time = 2; // For example 30m, 1h, or 1d.
}

message ApiResponse {
  int32 code = 1;
  string message = 2;
  google.protobuf.Value data = 3;
  string token = 4;
  string raw_json = 5;
}
