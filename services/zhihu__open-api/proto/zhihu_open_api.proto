syntax = "proto3";

package Zhihu_Open_Api;

import "google/protobuf/struct.proto";

option go_package = "miner/grpc-service/Zhihu_Open_Api";

// 知乎数据开放平台服务
// 封装知乎开放平台(https://developer.zhihu.com/docs)的内容搜索、热榜、
// 知识库(RAG)与用户数据 API。所有方法均使用 Bearer Access Secret 鉴权，
// 用户数据方法可额外携带 X-OAuth-Token 查询已授权用户的数据。
service Zhihu_Open_Api {
  // 校验 Access Secret 凭证并返回连通状态。
  rpc CheckConnectivity(EmptyRequest) returns (ConnectivityResponse) {}
  // 额度查询。返回当前 Access Secret 所属账号自然日内的各项能力限免额度，
  // 该查询不消耗业务额度。Data 为额度项数组。
  rpc GetQuota(GetQuotaRequest) returns (JsonListResponse) {}

  // 知乎站内搜索。返回与查询相关的问题、回答或文章结果。
  rpc ZhihuSearch(ZhihuSearchRequest) returns (JsonResponse) {}
  // 全网搜索。可按站点域名、发布时间等高级语法筛选结果。
  rpc GlobalSearch(GlobalSearchRequest) returns (JsonResponse) {}
  // 知乎热榜。返回结构化的问题与文章热榜条目。
  rpc GetHotList(HotListRequest) returns (JsonResponse) {}

  // 问题推荐。按当前用户画像或指定主题推荐适合回答的知乎问题。
  rpc GetQuestionRecommendations(GetQuestionRecommendationsRequest) returns (JsonResponse) {}

  // 知识库列表。获取当前用户创建或订阅的知识库。
  rpc ListKnowledgeBases(ListKnowledgeBasesRequest) returns (JsonResponse) {}
  // 知识库内容列表。分页获取指定知识库中的内容。
  rpc ListKnowledgeBaseItems(ListKnowledgeBaseItemsRequest) returns (JsonResponse) {}
  // 知识库文件上传。同步完成解析并挂载到知识库。
  rpc UploadKnowledgeFile(UploadKnowledgeFileRequest) returns (JsonResponse) {}
  // 知识库检索。使用 RAG 从指定知识库或召回范围检索相关文档片段。
  rpc SearchKnowledge(SearchKnowledgeRequest) returns (JsonResponse) {}

  // 用户的内容。获取知乎用户公开范围内的创作内容。
  rpc GetUserContents(GetUserContentsRequest) returns (JsonResponse) {}
  // 用户的关注。获取知乎用户公开范围内的关注列表。
  rpc GetUserFollowees(GetUserFolloweesRequest) returns (JsonResponse) {}
  // 用户的收藏。获取知乎用户公开范围内的近期收藏内容。
  rpc GetUserCollections(GetUserCollectionsRequest) returns (JsonResponse) {}
  // 用户收藏夹列表。获取知乎用户公开范围内的收藏夹。
  rpc GetUserFavlists(GetUserFavlistsRequest) returns (JsonResponse) {}
  // 收藏夹内容。获取指定收藏夹中的公开内容。
  rpc GetFavlistContents(GetFavlistContentsRequest) returns (JsonResponse) {}
}

message EmptyRequest {}

// 额度查询请求
message GetQuotaRequest {
  // 逗号分隔的 API ID，如 "knowledge,zhihu_search"；不传时返回全部可展示额度。
  // 可查：global_search / zhihu_search / hot_list / user_data / zhida_openai /
  // knowledge / tools
  string api_ids = 1;
}

message ConnectivityResponse {
  bool reachable = 1;
  string message = 2;
}

// 知乎站内搜索请求
message ZhihuSearchRequest {
  // 查询关键词，必填，不能为空。
  string query = 1;
  // 请求数量，默认 10，最大 10；越界值会被服务端截断。
  int32 count = 2;
}

// 全网搜索请求
message GlobalSearchRequest {
  // 查询关键词，必填，不能为空。
  string query = 1;
  // 请求数量，默认 10，最大 20；越界值会被服务端截断。
  int32 count = 2;
  // 高级语法筛选表达式，例如 host=="example.com" AND publish_time>=1778494631。
  string filter = 3;
  // 索引库选择：all / realtime / static，默认 all。
  string search_db = 4;
}

// 知乎热榜请求
message HotListRequest {
  // 返回数量，默认 30，最大 30；越界值会被服务端截断。
  int32 limit = 1;
}

// 问题推荐请求
message GetQuestionRecommendationsRequest {
  // 主题关键词；不传时按当前用户画像推荐，传入时按主题推荐（去除首尾空白后不能为空）。
  string query = 1;
  // 返回数量，范围 1..20，默认 5；越界值会被服务端截断。
  int32 count = 2;
}

// 知识库列表请求
message ListKnowledgeBasesRequest {
  // 范围：all / created / subscribed，默认 all。
  string scope = 1;
}

// 知识库内容列表请求
message ListKnowledgeBaseItemsRequest {
  // 知识库 ID，必填。
  string knowledge_base_id = 1;
  // 上一页返回的不透明游标，调用方不要解析或修改。
  string cursor = 2;
  // 每页数量，范围 1..20，默认 20。
  int32 limit = 3;
}

// 知识库文件上传请求
message UploadKnowledgeFileRequest {
  // 文件名，必填，合法 UTF-8 且不超过 255 字节。
  string file_name = 1;
  // 文件内容，必填，Base64 编码；单文件最大 100 MB。
  bytes file_content = 2;
  // 目标知识库 ID，不传时使用当前用户的默认知识库。
  string knowledge_base_id = 3;
}

// 知识库检索请求
message SearchKnowledgeRequest {
  // 检索问题，必填，去除首尾空白后不能为空。
  string query = 1;
  // 指定知识库 ID 列表，与 recall_scopes 至少有一个非空。
  repeated string knowledge_base_ids = 2;
  // 召回范围：personal / subscription / public。
  repeated string recall_scopes = 3;
  // 返回文档数量，范围 1..10，默认 10。
  int32 limit = 4;
}

// 用户的内容请求
message GetUserContentsRequest {
  // 内容类型，必填：all / answer / article / zvideo / pin / question。
  string content_type = 1;
  // 分页偏移量，默认 0。
  int64 offset = 2;
  // 返回数量，默认 20，最大 50。
  int64 limit = 3;
  // 排序字段：like_count / ts，默认 ts。
  string sort_field = 4;
  // 排序方向：asc / desc，默认 desc。
  string sort_order = 5;
  // 可选 OAuth 访问凭证；不传时查询本人，传入时查询已授权用户。
  string oauth_token = 6;
}

// 用户的关注请求
message GetUserFolloweesRequest {
  // 分页偏移量，默认 0。
  int64 offset = 1;
  // 返回数量，默认 20，最大 50。
  int64 limit = 2;
  // 可选 OAuth 访问凭证。
  string oauth_token = 3;
}

// 用户的收藏请求
message GetUserCollectionsRequest {
  // 返回数量，默认 20。
  int64 limit = 1;
  // 可选 OAuth 访问凭证。
  string oauth_token = 2;
}

// 用户收藏夹列表请求
message GetUserFavlistsRequest {
  // 返回数量，默认 20。
  int64 limit = 1;
  // 可选 OAuth 访问凭证。
  string oauth_token = 2;
}

// 收藏夹内容请求
message GetFavlistContentsRequest {
  // 收藏夹 URL 标识，必填，可从用户收藏夹列表 API 获取。
  int64 favlist_url_token = 1;
  // 分页偏移量，默认 0。
  int64 offset = 2;
  // 返回数量，默认 20。
  int64 limit = 3;
  // 可选 OAuth 访问凭证。
  string oauth_token = 4;
}

// 通用 JSON 响应。data 为知乎开放平台响应的 Data 对象，结构随方法不同而变化。
message JsonResponse {
  google.protobuf.Struct data = 1;
}

// 通用 JSON 列表响应。data 为知乎开放平台响应的 Data 数组（如额度查询）。
message JsonListResponse {
  google.protobuf.ListValue data = 1;
}
