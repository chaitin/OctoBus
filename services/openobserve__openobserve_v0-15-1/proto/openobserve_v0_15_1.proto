syntax = "proto3";

package OpenObserve_v0_15_1;

option go_package = "miner/grpc-service/OpenObserve_v0_15_1";

service OpenObserve_v0_15_1 {
  rpc ListOrganizations(ListOrganizationsRequest) returns (ListOrganizationsResponse);
  rpc ListStreams(ListStreamsRequest) returns (ListStreamsResponse);
  rpc GetStreamSchema(GetStreamSchemaRequest) returns (GetStreamSchemaResponse);
  rpc SearchData(SearchDataRequest) returns (SearchDataResponse);
  rpc ListFunctions(ListFunctionsRequest) returns (ListFunctionsResponse);
}

message ListOrganizationsRequest {}

message OrganizationInfo {
  string id = 1;
  string name = 2;
  string identifier = 3;
  string raw_json = 4;
}

message ListOrganizationsResponse {
  repeated OrganizationInfo organizations = 1;
  string raw_body = 2;
}

message ListStreamsRequest {
  string org_id = 1;
  string stream_type = 2;
  bool fetch_schema = 3;
}

message StreamInfo {
  string name = 1;
  string stream_type = 2;
  string created_at = 3;
  string raw_json = 4;
}

message ListStreamsResponse {
  repeated StreamInfo streams = 1;
  string raw_body = 2;
}

message GetStreamSchemaRequest {
  string org_id = 1;
  string stream = 2;
}

message StreamSchemaField {
  string name = 1;
  string type = 2;
  string raw_json = 3;
}

message StreamSchema {
  repeated StreamSchemaField fields = 1;
  string raw_json = 2;
}

message GetStreamSchemaResponse {
  string stream = 1;
  StreamSchema schema = 2;
  string raw_body = 3;
}

message SearchDataRequest {
  string org_id = 1;
  string stream = 2;
  string query = 3;
  int64 start_time = 4;
  int64 end_time = 5;
  int32 size = 6;
  int32 from = 7;
  string sort_by = 8;
  bool sort_desc = 9;
}

message SearchHit {
  string timestamp = 1;
  string source_json = 2;
}

message SearchDataResponse {
  int32 took = 1;
  int32 total = 2;
  int32 size = 3;
  int32 from = 4;
  repeated SearchHit hits = 5;
  string scan_size = 6;
  string raw_body = 7;
}

message ListFunctionsRequest {
  string org_id = 1;
}

message FunctionInfo {
  string name = 1;
  string created_at = 2;
  string updated_at = 3;
  string raw_json = 4;
}

message ListFunctionsResponse {
  repeated FunctionInfo functions = 1;
  string raw_body = 2;
}